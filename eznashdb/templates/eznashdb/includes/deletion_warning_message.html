{% load i18n %}
{% blocktrans with shul_name=shul.name %}'{{ shul_name }}' has been deleted.{% endblocktrans %}
<br />
<br />
{% trans "Was this a mistake?" %}
<form method="post"
      action="{% url 'eznashdb:undelete_shul' pk=shul.id %}"
      class="d-inline">
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-secondary ms-2 align-baseline">
        <i class="fa-solid fa-rotate-left"></i>
        {% trans "Undo" %}
    </button>
</form>
