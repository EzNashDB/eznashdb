{# Parameters: shul, classes (extra classes for the wrapper) #}
{% load i18n %}
<div class="small fst-italic text-muted {{ classes }}">
    {% trans "Updated" %} <span data-utc="{{ shul.updated_at|date:'c' }}"
       x-init="$el.textContent = new Date($el.dataset.utc).toLocaleString(document.documentElement.lang, {dateStyle: 'medium'})"></span>
</div>
