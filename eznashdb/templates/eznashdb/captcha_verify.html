{% extends "centered_card_base.html" %}

{% load i18n %}

{% block card_header %}
    <h4>{% trans "Verification Required" %}</h4>
{% endblock %}

{% block card_body %}
    <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}">
        {% include "includes/captcha_content.html" %}
        <button type="submit" class="btn btn-primary mt-3">{% trans "Continue" %}</button>
    </form>
{% endblock %}
