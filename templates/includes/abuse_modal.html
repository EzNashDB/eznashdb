<div class="modal fade" id="abuse-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    {% if abuse_state.is_permanently_banned %}
                        Access Restricted
                    {% else %}
                        Temporarily Blocked
                    {% endif %}
                </h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">{% include "includes/abuse_blocked_content.html" %}</div>
        </div>
    </div>
</div>
