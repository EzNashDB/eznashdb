{% load svg %}
<nav class="navbar navbar-dark bg-dark navbar-expand-lg">
    <div class="container">
        <div class="d-flex align-items-center justify-content-between flex-nowrap flex-grow-1 gap-1 min-w-0">
            <a class="navbar-brand me-1 d-flex align-items-center gap-2 py-1 text-truncate"
               href="/">
                <span class="navbar-logo flex-shrink-0" aria-hidden="true">{% inline_svg 'img/logo.svg' %}</span>
                <span class="d-flex flex-column lh-1 text-truncate">
                    <span class="text-truncate">The Ezrat Nashim Database</span>
                    <small class="text-white-50 fw-normal text-truncate"
                           style="font-size: 0.8rem">A project by Ari Abramowitz</small>
                </span>
            </a>
            <button class="navbar-toggler flex-shrink-0"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                {% for item in navbar_items %}
                    {% include 'includes/navbar_item.html' %}
                {% endfor %}
                {% if user.is_authenticated %}
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle"
                           href="#"
                           id="accountDropdown"
                           role="button"
                           data-bs-toggle="dropdown"
                           aria-expanded="false">Account</a>
                        <ul class="dropdown-menu dropdown-menu-end"
                            aria-labelledby="accountDropdown">
                            <li>
                                <h6 class="dropdown-header text-truncate" style="max-width: 250px;">{{ user.email }}</h6>
                            </li>
                            <li>
                                <form method="POST" action="{% url 'account_logout' %}" class="d-inline">
                                    {% csrf_token %}
                                    <button type="submit" class="dropdown-item">Logout</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
