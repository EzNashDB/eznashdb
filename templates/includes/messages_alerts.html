{% load i18n %}
<!-- Messages as dismissible alerts (for auth pages or other contexts) -->
{% if messages %}
    <div>
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show"
                 role="alert">
                {{ message }}
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="{% trans 'Close' %}"></button>
            </div>
        {% endfor %}
    </div>
{% endif %}
