<div class="modal fade"
     id="abuse-captcha-modal"
     tabindex="-1"
     data-bs-backdrop="static"
     data-bs-keyboard="false"
     data-next="{{ next_url }}"
     aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Verification Required</h5>
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form hx-post="{% url 'captcha_verify' %}"
                      hx-target="#abuse-modal-container"
                      hx-swap="innerHTML">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next_url }}">
                    {% include "includes/captcha_content.html" %}
                    <button type="submit" class="btn btn-primary mt-3">Verify and Continue</button>
                </form>
            </div>
        </div>
    </div>
</div>
